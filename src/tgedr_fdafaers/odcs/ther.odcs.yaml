apiVersion: v3.1.0
kind: DataContract
id: urn:datacontract:tgedr:fdafaers:ther
name: ther
version: 1.0.0
status: active
description:
  purpose: Drug therapy start/end dates as reported for FAERS adverse events (THER table).
  usage: Used for analyzing drug therapy durations for drug-event association studies.
  limitations: Data is limited to what is available in the FAERS database.

tags:
  - healthcare
  - faers
  - pharmacovigilance

schema:
  - name: ther
    physicalName: ther
    physicalType: table
    description: One row per reported therapy period for a drug in a FAERS adverse event report.
    properties:
      - name: primaryid
        primaryKey: true
        logicalType: integer
        physicalType: BIGINT
        required: true
        unique: false
        description: Primary identifier for the adverse event report; links back to the demo table.
      - name: caseid
        logicalType: integer
        physicalType: DOUBLE
        required: false
        description: Case identifier; groups multiple reports that refer to the same case.
      - name: dsg_drug_seq
        primaryKey: true
        logicalType: integer
        physicalType: BIGINT
        required: true
        unique: false
        description: Sequence number linking the therapy to a drug in the drug table.
      - name: start_dt
        logicalType: integer
        physicalType: DOUBLE
        required: false
        description: Start date of drug therapy, YYYYMMDD.
        examples:
          - 20240101
      - name: end_dt
        logicalType: integer
        physicalType: DOUBLE
        required: false
        description: End date of drug therapy, YYYYMMDD.
        examples:
          - 20240315
      - name: dur
        logicalType: number
        physicalType: DOUBLE
        required: false
        description: Duration of drug therapy.
      - name: dur_cod
        logicalType: string
        physicalType: VARCHAR
        required: false
        description: Unit of the therapy duration, e.g. DY (day), WK (week), MO (month), YR (year).
        examples:
          - DY
          - WK
          - MO
          - YR
      - name: processing_time
        logicalType: integer
        physicalType: BIGINT
        required: true
        description: Unix epoch timestamp in seconds (UTC) when the row was processed.
      - name: period
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: FAERS quarterly reporting period, e.g. 2024Q2.
        examples:
          - 2024Q2

customProperties:
  - property: expectations
    value:
      expectation_suite_name: ther_suite
      expectations:
        - expectation_type: expect_column_to_exist
          kwargs:
            column: primaryid
        - expectation_type: expect_column_to_exist
          kwargs:
            column: caseid
        - expectation_type: expect_column_to_exist
          kwargs:
            column: dsg_drug_seq
        - expectation_type: expect_column_to_exist
          kwargs:
            column: start_dt
        - expectation_type: expect_column_to_exist
          kwargs:
            column: end_dt
        - expectation_type: expect_column_to_exist
          kwargs:
            column: dur
        - expectation_type: expect_column_to_exist
          kwargs:
            column: dur_cod
        - expectation_type: expect_column_to_exist
          kwargs:
            column: processing_time
        - expectation_type: expect_column_to_exist
          kwargs:
            column: period
        - expectation_type: expect_column_values_to_not_be_null
          kwargs:
            column: primaryid
        - expectation_type: expect_column_values_to_not_be_null
          kwargs:
            column: dsg_drug_seq
        - expectation_type: expect_column_values_to_not_be_null
          kwargs:
            column: processing_time
        - expectation_type: expect_column_values_to_not_be_null
          kwargs:
            column: period
