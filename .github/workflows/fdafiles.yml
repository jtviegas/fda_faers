name: fdafiles

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12.3"
  HF_DATASET_BRONZE: "jtviegas/faers_bronze"
  MAX_PERIODS_TO_PROCESS: 3

jobs:
  execute_pipeline:
    runs-on: ubuntu-24.04
    # outputs:
    #   output: ${{ steps.py-step.outputs.run_next }}
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: 'install uv'
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: 'setup python env'
      run: |
        uv venv .venv --python ${{ env.PYTHON_VERSION }}
    - name: 'install library'
      run: uv pip install --python .venv/bin/python tgedr-fdafaers
    - name: 'find periods to process'
      id: find_periods
      run: |
        uv run run --module tgedr_fdafaers.etl.periods_to_process \
          --classname Periods2Process \
          --callable run \
          --classparams "{\"configuration\": {\"bronze_dataset\": \"${{ env.HF_DATASET_BRONZE }}\"}}"
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
    - name: 'fetch period files to process'
      id: fetch_period_files
      run: |
        uv run run --module tgedr_fdafaers.etl.fetch_period_files \
          --classname FetchPeriodFiles \
          --callable run \
          --classparams "{\"configuration\": {\"periods\": \"${{ steps.find_periods.outputs.result }}\", \"max_periods\": ${{ env.MAX_PERIODS_TO_PROCESS }}}}"
    - name: 'set output'
      run: |
        echo "Periods: ${{ steps.fetch_period_files.outputs.result }}"
